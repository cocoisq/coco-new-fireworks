name: Extract Android Project

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "找不到 Android 專案 ZIP"
            exit 1
          fi

          # 移除錯誤建立的同名資料夾
          rm -rf .github/workflows/build-apk.yml

          # 解壓縮，但暫時不覆蓋 APK 工作流程
          unzip -o "$ZIP_FILE" -d . -x '.github/workflows/build-apk.yml'

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md build.gradle settings.gradle gradle.properties app
          git add -A .github/workflows/build-apk.yml

          git diff --cached --quiet || git commit -m "Fix Coco project extraction"
          git push
